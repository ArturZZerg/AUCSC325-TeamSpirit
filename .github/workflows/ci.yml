name: CampusFlow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow_ci
          POSTGRES_DB: campusflow_test
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campusflow:campusflow_ci@127.0.0.1:55435/campusflow_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run check
      - name: Build and check isolated production API container
        shell: bash
        run: |
          docker build -f ops/vps/Dockerfile --target runtime -t campusflow-api:ci .
          export AUTH_RATE_KEY="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$AUTH_RATE_KEY"
          trap 'docker rm -f campusflow-ci-api >/dev/null 2>&1 || true' EXIT
          docker run -d --name campusflow-ci-api --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 768m --pids-limit 128 \
            --env DATABASE_URL --env AUTH_RATE_KEY --env NODE_ENV=production \
            --env HOST=127.0.0.1 --env PORT=8780 --env AUTH_SOURCE_MODE=loopback \
            --env CORS_ORIGIN=https://app.example.test --env REGISTRATION_MODE=closed \
            --env RECOVERY_DELIVERY=disabled --env CANVAS_MODE=disabled campusflow-api:ci
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:8780/health/ready >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --max-time 4 http://127.0.0.1:8780/auth/capability \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.registration!=='closed'||v.verificationAvailable!==false)process.exit(1)})"
      - run: npm run build:web -w @campusflow/mobile
      - run: npm run release:restore-rehearsal
        env:
          REHEARSAL_DATABASE_URL: ${{ env.DATABASE_URL }}
          PG_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
