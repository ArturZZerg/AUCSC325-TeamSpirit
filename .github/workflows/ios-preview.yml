name: iOS simulator preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'apps/api/**', 'packages/contracts/**', 'packages/domain/**', 'package*.json', 'scripts/*ios*', '.maestro/ios-*.yaml', '.github/workflows/ios-preview.yml']
  pull_request:
    paths: ['apps/mobile/**', 'apps/api/**', 'packages/contracts/**', 'packages/domain/**', 'package*.json', 'scripts/*ios*', '.maestro/ios-*.yaml', '.github/workflows/ios-preview.yml']
permissions:
  contents: read
concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CI: 'true'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: bash scripts/build-ios-simulator.sh --check
      - run: npm run build:ios:simulator
        id: build
      - name: Install pinned local Maestro CLI
        run: |
          curl --fail --location --retry 2 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.6.1/maestro.zip -o .local/maestro.zip
          echo '3440825f514f537c6a96bcf5de995780c2a4a7f83a43208fdc95d4f1fecfad3b  .local/maestro.zip' | shasum -a 256 -c -
          unzip -q .local/maestro.zip -d .local
          .local/maestro/bin/maestro --version
      - name: Boot only this job's iPhone simulator and run public flows
        run: |
          if lsof -nP -iTCP:3000 -sTCP:LISTEN >/dev/null; then echo 'Public offline acceptance requires no loopback API/Metro listener.' >&2; exit 1; fi
          bash scripts/boot-ios-simulator.sh
          udid="$(node -p "require('./artifacts/ios/evidence/boot.json').udid")"
          xcrun simctl ui "$udid" appearance light
          xcrun simctl status_bar "$udid" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$udid" .local/ios-derived-data/Build/Products/Release-iphonesimulator/CampusFlow.app
          xcrun simctl launch "$udid" com.campusflow.mobile > artifacts/ios/evidence/launch.txt
          xcrun simctl terminate "$udid" com.campusflow.mobile
          .local/maestro/bin/maestro --device "$udid" test --format JUNIT \
            --output artifacts/ios/evidence/public-link-request.xml --debug-output artifacts/ios/evidence/maestro-request \
            --test-output-dir "$PWD/artifacts/ios/evidence/screenshots-request" .maestro/ios-public-link-request.yaml
          # Release the observing driver before checking the OS-confirmed first link.
          # Keep the installed app and simulator state; both CLI results are required.
          .local/maestro/bin/maestro --device "$udid" test --no-reinstall-driver --format JUNIT \
            --output artifacts/ios/evidence/public-flow.xml --debug-output artifacts/ios/evidence/maestro \
            --test-output-dir "$PWD/artifacts/ios/evidence/screenshots" .maestro/ios-public.yaml
      - name: Collect public simulator diagnostics
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          xcrun simctl spawn "$IOS_SIMULATOR_UDID" log show --last 5m --style compact --info --debug --predicate 'process == "CampusFlow" OR ((process == "SpringBoard" OR process == "runningboardd") AND eventMessage CONTAINS "com.campusflow.mobile")' > artifacts/ios/evidence/native-system.log
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot artifacts/ios/evidence/last-native-frame.png
      - name: Verify native session storage and offline cleanup with disposable PostgreSQL
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          CAMPUSFLOW_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          brew install postgresql@17
          export IOS_PG_BIN="$(brew --prefix postgresql@17)/bin"
          node scripts/ios-storage-acceptance.mjs
      - name: Stop only this job's simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$IOS_SIMULATOR_UDID"
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: campusflow-ios-simulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ios/campusflow-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campusflow-ios-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ios/evidence
          if-no-files-found: warn
          retention-days: 7
