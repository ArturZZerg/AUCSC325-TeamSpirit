    <div class = "date__controls">
        <form method = "get">
            <button class = "btn btn-secondary" type = "submit" name = "date" value = "2026-10-19">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </form>
        <input type = "text" id = "date-input" class = "date__input" :value = "Day.date">
        <form method = "get">
            <button class = "btn btn-secondary" type = "submit" name = "date" value = "2026-10-21">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </form>
    </div>
    <div class = "menu">
        <template x-for = "(meal,meal_name) in Day.meals" :key = "meal_name">
            <div class = "meal">
                <h1 class = "meal__label" x-text = "meal.label"></h1>
                <template x-for = "(offering,station_name) in meal.offerings" :key = "station_name">
                    <div class = "station" :class = "(offering.closed) ? 'station--closed' : ''">
                        <div class = "station__label" x-text = "offering.station_label"></div>
                        <template x-if = "offering.hasOwnProperty('items')">
                            <div class = "station__offering">
                                <template x-for = "(item,item_index) in offering.items" :key="item_index">
                                    <div class = "offering__item">
                                        <span x-text = "item.label"></span><span class = "item__calories"> (<span x-text = "item.calories"></span>cal.)</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                                            </div>
                </template>
            </div>
        </template>
    </div>
