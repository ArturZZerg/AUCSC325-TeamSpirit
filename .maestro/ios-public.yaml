appId: com.campusflow.mobile
name: iOS public offline Help and account navigation
---
# Continue the request flow in the same app state, without relaunch or reset.
- extendedWaitUntil:
    visible: A little help for your day.
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: ios-help-first-link
- tapOn: Back to sign in
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- tapOn: Help & data
- assertVisible: A little help for your day.
- tapOn: Back to sign in
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- openLink: campusflow://help
- assertVisible: A little help for your day.
- assertVisible: Search help
- takeScreenshot: ios-help
- tapOn:
    id: help-search
- inputText: offline
- hideKeyboard
- scrollUntilVisible:
    element:
      text: What can I do without a connection\?
    direction: DOWN
- tapOn: What can I do without a connection\?
- assertVisible: Previously saved information can be read.*
- takeScreenshot: ios-help-offline-answer
- scrollUntilVisible:
    element:
      text: Clear search
    direction: UP
- tapOn: Clear search
- openLink: campusflow:///account
- assertVisible: Sign in to manage your account
- openLink: campusflow:///help?next=https%3A%2F%2Funtrusted.test
- assertVisible: A little help for your day.
- stopApp
