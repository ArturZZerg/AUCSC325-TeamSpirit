appId: com.campusflow.mobile
name: iOS ordinary sign-in and owned task capture
---
- launchApp
- openLink: campusflow:///today
- runFlow: ios-confirm-link.yaml
- extendedWaitUntil:
    visible: Welcome back
    timeout: 45000
# Keyboard chaining: Return on the email field focuses the password, and Return
# on the password signs in. No hideKeyboard (on iOS it can tap through to
# another control) and no dependence on the button being above the keyboard.
- tapOn:
    id: auth-email
- inputText: ${IOS_QA_EMAIL}
- pressKey: Enter
- inputText: ${IOS_QA_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 30000
- waitForAnimationToEnd
# iOS may offer to save the password. The sheet can ignore a tap made during
# its presentation animation, so settle, tap, and tap once more if it remains.
- runFlow:
    when:
      visible: '^Not Now$'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          text: '^Not Now$'
          retryTapIfNoChange: true
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: '^Not Now$'
    commands:
      - tapOn:
          text: '^Not Now$'
          retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: '^Not Now$'
    timeout: 20000
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 10000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today-add-task
    direction: UP
- tapOn:
    id: today-add-task
- extendedWaitUntil:
    visible: New task
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: task-title
- inputText: ${IOS_QA_TASK}
# Return dismisses the single-line title keyboard without tapping elsewhere.
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: Save task
    direction: DOWN
- tapOn: Save task
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${IOS_QA_TASK}
    direction: DOWN
- assertVisible: ${IOS_QA_TASK}
- stopApp
