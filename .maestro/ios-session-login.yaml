appId: com.campusflow.mobile
name: iOS owned task capture after verified ordinary XCTest sign-in
---
- launchApp
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 30000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today-add-task
    direction: UP
- tapOn:
    id: today-add-task
- extendedWaitUntil:
    visible: New task
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: task-title
- inputText: ${IOS_QA_TASK}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Save task
    direction: DOWN
- tapOn: Save task
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ${IOS_QA_TASK}
    direction: DOWN
- assertVisible: ${IOS_QA_TASK}
- stopApp
