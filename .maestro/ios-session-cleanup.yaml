appId: com.campusflow.mobile
name: iOS online sign-out and private cleanup
---
- launchApp
- extendedWaitUntil:
    visible: Your daily flow
    timeout: 30000
- tapOn: Settings, tab, 5 of 5
- scrollUntilVisible:
    element:
      text: Sign out
    direction: DOWN
- tapOn: Sign out
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- assertNotVisible: Retry device cleanup
# Keep the signed-out app alive for its bounded best-effort server revocation.
# The harness verifies server/cache cleanup, then explicitly terminates this app
# before the API-disconnected cold signed-out check.
