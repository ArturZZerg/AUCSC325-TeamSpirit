appId: com.campusflow.mobile
name: iOS public cold Help link after termination
---
# The preceding public flow terminates the app; do not launch it before this link.
- openLink: campusflow:///help
- runFlow: ios-confirm-link.yaml
- extendedWaitUntil:
    visible: A little help for your day.
    timeout: 30000
- takeScreenshot: ios-help-cold
- openLink: campusflow:///unavailable-link?code=ignored-link-code&next=https%3A%2F%2Funtrusted.test
- runFlow: ios-confirm-link.yaml
- extendedWaitUntil:
    visible: This page isn’t available.
    timeout: 30000
- assertNotVisible: ignored-link-code
- assertNotVisible: https://untrusted.test
- waitForAnimationToEnd
- takeScreenshot: ios-unavailable-warm
- tapOn: Back to sign in
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- stopApp
