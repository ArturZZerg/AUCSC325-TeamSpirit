# Self-hosted app updates (ADR 021). http-level: install as
# /etc/nginx/conf.d/campusflow-updates-map.conf. Only allow-listed header values
# can select a manifest, so a request cannot leave /var/www/campusflow-updates.
map $http_expo_platform $campusflow_update_platform {
    default "";
    android android;
    ios ios;
}
map $http_expo_runtime_version $campusflow_update_runtime {
    default "";
    "~^[0-9]{1,6}$" $http_expo_runtime_version;
}
