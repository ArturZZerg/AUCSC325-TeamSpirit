# Include within the existing authorized HTTPS server block only.
location = /campusflow-api { return 308 /campusflow-api/; }
location /campusflow-api/ {
    proxy_pass http://127.0.0.1:8780/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 256k;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# Calendar file uploads for the timetable import preview: the only API route above 256k.
location = /campusflow-api/classes/import-preview {
    proxy_pass http://127.0.0.1:8780/classes/import-preview;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 1m;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# openGym backup import (ADR 022): up to 4 MB of JSON read as a raw body.
location = /campusflow-api/gym/import/opengym {
    proxy_pass http://127.0.0.1:8780/gym/import/opengym;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
