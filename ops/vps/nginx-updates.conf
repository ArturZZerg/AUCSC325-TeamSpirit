# Self-hosted app updates (ADR 021). Include within the existing authorized HTTPS
# server block only, next to nginx-location.conf; needs nginx-updates-map.conf.
# ops/vps/upload-update.sh fills /var/www/campusflow-updates.
location = /campusflow-updates/manifest {
    if ($campusflow_update_platform = "") { return 400; }
    if ($campusflow_update_runtime = "") { return 404; }
    root /var/www/campusflow-updates;
    try_files /$campusflow_update_platform/$campusflow_update_runtime/manifest.json =404;
    types { }
    default_type application/json;
    add_header expo-protocol-version 1 always;
    add_header expo-sfv-version 0 always;
    add_header Cache-Control "private, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# Bundles and assets are named by their SHA-256 and never change.
location ^~ /campusflow-updates/assets/ {
    alias /var/www/campusflow-updates/assets/;
    try_files $uri =404;
    types { }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# Native releases: latest.json and the APKs it names. Manifests are only served above.
# Quoted: nginx treats an unquoted { inside a regex as the start of the block.
location ~ "^/campusflow-updates/android/(latest\.json|campusflow-[0-9]{1,6}\.apk)$" {
    root /var/www;
    try_files $uri =404;
    types { application/json json; application/vnd.android.package-archive apk; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
