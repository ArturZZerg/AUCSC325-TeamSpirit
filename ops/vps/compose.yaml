services:
  api:
    image: ${CAMPUSFLOW_IMAGE:?Set the reviewed immutable CampusFlow image}
    container_name: campusflow-api
    env_file: /etc/campusflow/api.env
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8780/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
