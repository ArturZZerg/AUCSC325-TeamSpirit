# Hosted web app (ADR 018). Include within the existing authorized HTTPS server
# block only, next to nginx-location.conf. /var/www/campusflow-site/campusflow is
# a symlink that deploy.sh points at the accepted release directory.
# ^~ keeps any regex location elsewhere in the shared server block from taking
# over these files. add_header here replaces server-level headers, so every
# location repeats the ones it needs.
location = /campusflow { return 308 /campusflow/; }
location ^~ /campusflow/ {
    root /var/www/campusflow-site;
    try_files $uri /campusflow/index.html =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # SQLite on the web needs cross-origin isolation.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
}
# Content-hashed bundles and assets never change under the same name, and a
# missing one is a real 404 rather than the app shell.
location ^~ /campusflow/_expo/ {
    root /var/www/campusflow-site;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location ^~ /campusflow/assets/ {
    root /var/www/campusflow-site;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# Exercise photos (ADR 022): public-domain free-exercise-db images synced by
# ops/vps/sync-exercise-media.py into /var/www/campusflow-media.
location ^~ /campusflow-media/ {
    root /var/www;
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=2592000" always;
}
