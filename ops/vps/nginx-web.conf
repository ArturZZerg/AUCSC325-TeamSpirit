# Hosted web app (ADR 018). Include within the existing authorized HTTPS server
# block only, next to nginx-location.conf. /var/www/campusflow-site/campusflow is
# a symlink that deploy.sh points at the accepted release directory.
location = /campusflow { return 308 /campusflow/; }
location /campusflow/ {
    root /var/www/campusflow-site;
    try_files $uri /campusflow/index.html;
    # add_header here replaces the server-level headers, so repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # SQLite on the web needs cross-origin isolation.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
}
# Content-hashed bundles and assets never change under the same name.
location ^~ /campusflow/_expo/ {
    root /var/www/campusflow-site;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
